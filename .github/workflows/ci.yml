name: Tether CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-checks:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netwatch_test
          POSTGRES_USER: netwatch
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Alembic Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg://netwatch:testpassword@localhost:5432/netwatch_test
          ENVIRONMENT: development
        run: |
          alembic upgrade head

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-32-characters-minimum-length-long
        run: |
          python -m pytest -v

  frontend-checks:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Frontend Vitest Suite
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build

  docker-build-checks:
    name: Container Security & Multi-Stage Builds
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t tether-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t tether-frontend:ci ./frontend
