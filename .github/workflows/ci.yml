name: Tether CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-checks:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netwatch_test
          POSTGRES_USER: netwatch
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Temporary Test .env
        run: |
          cat << 'EOF' > .env
          ENVIRONMENT=test
          LOG_LEVEL=INFO
          LOG_FORMAT=text
          APP_NAME=Tether
          APP_VERSION=1.0.0
          DATABASE_URL=postgresql+psycopg://netwatch:testpassword@localhost:5432/netwatch_test
          DB_POOL_SIZE=5
          DB_MAX_OVERFLOW=2
          DB_POOL_TIMEOUT=10.0
          DB_POOL_RECYCLE=300
          REDIS_URL=redis://localhost:6379/0
          CELERY_QUEUE=monitoring
          SECRET_KEY=ci-test-cryptographically-secure-secret-key-32-chars-long
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          AUTH_RATE_LIMIT_PER_MINUTE=60
          CORS_ORIGINS=http://localhost:5173,http://localhost:3000
          SCHEDULER_TICK_INTERVAL_SECONDS=5.0
          RETRY_INITIAL_DELAY_SECONDS=1.0
          RETRY_BACKOFF_FACTOR=2.0
          RETRY_MAX_DELAY_SECONDS=30.0
          TARGET_LOCK_TTL_SECONDS=300
          RESULT_RETENTION_DAYS=30
          JOB_RETENTION_DAYS=14
          ALERT_RETENTION_DAYS=90
          AUDIT_LOG_RETENTION_DAYS=365
          EOF
          cp .env backend/.env

      - name: Validate Alembic Migrations
        working-directory: ./backend
        run: |
          alembic upgrade head

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        run: |
          python -m pytest -v

      - name: Clean Up Temporary .env
        if: always()
        run: |
          rm -f .env backend/.env

  frontend-checks:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Run Frontend Vitest Suite
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build

  docker-build-checks:
    name: Container Security & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Temporary Test .env for Docker Validation
        run: |
          cat << 'EOF' > .env
          ENVIRONMENT=test
          LOG_LEVEL=INFO
          LOG_FORMAT=json
          APP_NAME=Tether
          APP_VERSION=1.0.0
          DATABASE_URL=postgresql+psycopg://user:pass@localhost:5432/db
          DB_POOL_SIZE=10
          DB_MAX_OVERFLOW=5
          DB_POOL_TIMEOUT=15.0
          DB_POOL_RECYCLE=600
          REDIS_URL=redis://localhost:6379/0
          CELERY_QUEUE=monitoring
          SECRET_KEY=ci-docker-test-secret-key-32-chars-long-random
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          AUTH_RATE_LIMIT_PER_MINUTE=60
          CORS_ORIGINS=http://localhost
          SCHEDULER_TICK_INTERVAL_SECONDS=5.0
          RETRY_INITIAL_DELAY_SECONDS=1.0
          RETRY_BACKOFF_FACTOR=2.0
          RETRY_MAX_DELAY_SECONDS=30.0
          TARGET_LOCK_TTL_SECONDS=300
          RESULT_RETENTION_DAYS=30
          JOB_RETENTION_DAYS=14
          ALERT_RETENTION_DAYS=90
          AUDIT_LOG_RETENTION_DAYS=365
          EOF

      - name: Validate Docker Compose Configurations
        run: |
          docker compose config
          docker compose -f docker-compose.prod.yml config

      - name: Build Backend Docker Image
        run: |
          docker build -t tether-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t tether-frontend:ci ./frontend

      - name: Clean Up Temporary .env
        if: always()
        run: |
          rm -f .env
